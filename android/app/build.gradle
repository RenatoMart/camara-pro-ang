apply plugin: "com.android.application"
apply plugin: "org.jetbrains.kotlin.android"
apply plugin: "com.facebook.react"

/**
 * This is the configuration block to customize your React Native Android app.
 * By default you don't need to apply any configuration, just uncomment the lines you need.
 */
react {
    /* Folders */
    //   The root of your project, i.e. where "package.json" lives. Default is '../..'
    // root = file("../../")
    //   The folder where the react-native NPM package is. Default is ../../node_modules/react-native
    // reactNativeDir = file("../../node_modules/react-native")
    //   The folder where the react-native Codegen package is. Default is ../../node_modules/@react-native/codegen
    // codegenDir = file("../../node_modules/@react-native/codegen")
    //   The cli.js file which is the React Native CLI entrypoint. Default is ../../node_modules/react-native/cli.js
    // cliFile = file("../../node_modules/react-native/cli.js")

    /* Variants */
    //   The list of variants to that are debuggable. For those we're going to
    //   skip the bundling of the JS bundle and the assets. Default is "debug", "debugOptimized".
    //   If you add flavors like lite, prod, etc. you'll have to list your debuggableVariants.
    // debuggableVariants = ["liteDebug", "liteDebugOptimized", "prodDebug", "prodDebugOptimized"]

    /* Bundling */
    //   A list containing the node command and its flags. Default is just 'node'.
    // nodeExecutableAndArgs = ["node"]
    //
    //   The command to run when bundling. By default is 'bundle'
    // bundleCommand = "ram-bundle"
    //
    //   The path to the CLI configuration file. Default is empty.
    // bundleConfig = file(../rn-cli.config.js)
    //
    //   The name of the generated asset file containing your JS bundle
    // bundleAssetName = "MyApplication.android.bundle"
    //
    //   The entry file for bundle generation. Default is 'index.android.js' or 'index.js'
    //
    //   Este proyecto entra por `index.ts` (todo el código de la app es
    //   TypeScript), no por el `index.js` que asume el plugin. Metro lo
    //   resuelve solo en debug, pero la build de release genera el bundle
    //   desde Gradle y falla con «entryFile ... index.js which doesn't exist»
    //   si no se le dice la ruta exacta.
    entryFile = file("../../index.ts")
    //
    //   A list of extra flags to pass to the 'bundle' commands.
    //   See https://github.com/react-native-community/cli/blob/main/docs/commands.md#bundle
    // extraPackagerArgs = []

    /* Hermes Commands */
    //   The hermes compiler command to run. By default it is 'hermesc'
    // hermesCommand = "$rootDir/my-custom-hermesc/bin/hermesc"
    //
    //   The list of flags to pass to the Hermes compiler. By default is "-O", "-output-source-map"
    // hermesFlags = ["-O", "-output-source-map"]

    /* Autolinking */
    autolinkLibrariesWithApp()
}

/**
 * Set this to true to Run Proguard on Release builds to minify the Java bytecode.
 */
def enableProguardInReleaseBuilds = false

/**
 * The preferred build flavor of JavaScriptCore (JSC)
 *
 * For example, to use the international variant, you can use:
 * `def jscFlavor = io.github.react-native-community:jsc-android-intl:2026004.+`
 *
 * The international variant includes ICU i18n library and necessary data
 * allowing to use e.g. `Date.toLocaleString` and `String.localeCompare` that
 * give correct results when using with locales other than en-US. Note that
 * this variant is about 6MiB larger per architecture than default.
 */
def jscFlavor = 'io.github.react-native-community:jsc-android:2026004.+'

android {
    ndkVersion rootProject.ext.ndkVersion
    buildToolsVersion rootProject.ext.buildToolsVersion
    compileSdk rootProject.ext.compileSdkVersion

    namespace "com.camaraproang"
    defaultConfig {
        applicationId "com.camaraproang"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 2
        versionName "1.1"
    }

    // Motor de composición IA: código C++ propio (src/main/jni), no una
    // librería de RN. Sustituye al CMakeLists.txt "invisible" que pone el
    // plugin de React Native por defecto; por eso se copian aquí también
    // `ReactNative-application.cmake`/`OnLoad.cpp` (ver comentario en el
    // propio CMakeLists.txt).
    externalNativeBuild {
        cmake {
            path "src/main/jni/CMakeLists.txt"
        }
    }
    signingConfigs {
        debug {
            storeFile file('debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
    }
    buildTypes {
        debug {
            signingConfig signingConfigs.debug
            // La build de desarrollo se instala como una app aparte
            // (`com.camaraproang.debug`, nombre «CamaraPro dev» vía
            // `src/debug/res`), para que el APK de release pueda convivir con
            // ella en el mismo teléfono en vez de sustituirla al instalar.
            applicationIdSuffix ".debug"
        }
        release {
            // Firmado con el keystore de debug a propósito: esta app se
            // distribuye como APK de uso personal, no por Play Store. Si algún
            // día se publica, hay que generar un keystore propio.
            signingConfig signingConfigs.debug
            minifyEnabled enableProguardInReleaseBuilds
            proguardFiles getDefaultProguardFile("proguard-android.txt"), "proguard-rules.pro"
        }
    }

    sourceSets {
        main {
            // El modelo y sus metadatos siguen viviendo junto a la feature que
            // los usa (`src/features/camera/ai/assets`), pero se empaquetan
            // como assets del APK: el motor C++ los lee con `AAssetManager`,
            // así que el `.tflite` no pasa nunca por JavaScript. Antes se
            // pedía por `fetch` a la URL que resuelve Metro, y eso sólo
            // funciona en depuración: en release `resolveAssetSource` devuelve
            // un identificador de recurso Android, no una URL.
            assets.srcDirs += file("../../src/features/camera/ai/assets")
        }
    }

    androidResources {
        // El `.tflite` se guarda sin comprimir: se lee de un tirón al abrir el
        // asistente y comprimirlo sólo añade una descompresión en memoria (el
        // modelo es int8, así que el ahorro de tamaño es mínimo). Además deja
        // la puerta abierta a mapearlo con `mmap` más adelante.
        noCompress += ["tflite"]
    }

    packagingOptions {
        // `libtensorflowlite_jni.so` sólo la extrae y empaqueta este módulo
        // (ya no depende de react-native-fast-tflite), pero si algún día
        // vuelve a haber dos AARs ofreciendo el mismo .so, que gane la primera
        // en vez de que falle el merge de Gradle.
        jniLibs {
            pickFirsts += ["**/libtensorflowlite_jni.so"]
        }
    }
}

// Extracción del runtime de TensorFlow Lite (LiteRT) para el motor de
// composición: el .aar de Google trae el `.so` y los headers de la API C de
// TFLite (`tflite/c/c_api.h`). El motor de composición los usa desde C++
// propio (`src/main/jni/composition/`); no hay ninguna librería de React
// Native de por medio.
configurations {
    extractHeaders
    extractSO
}

dependencies {
    // The version of react-native is set by the React Native Gradle Plugin
    implementation("com.facebook.react:react-android")

    if (hermesEnabled.toBoolean()) {
        implementation("com.facebook.react:hermes-android")
    } else {
        implementation jscFlavor
    }

    implementation "com.google.ai.edge.litert:litert:1.4.0"
    extractSO "com.google.ai.edge.litert:litert:1.4.0"
    extractHeaders "com.google.ai.edge.litert:litert:1.4.0"
}

task extractLitertHeaders {
    doLast {
        configurations.extractHeaders.files.each { aarFile ->
            copy {
                from zipTree(aarFile)
                into "src/main/jni/composition/lib/litert/headers"
                include "headers/**/*.h"
                eachFile { details ->
                    details.path = details.path.replaceFirst("^headers/", "")
                }
                includeEmptyDirs = false
            }
        }
    }
}

task extractLitertSO {
    doLast {
        configurations.extractSO.files.each { aarFile ->
            copy {
                from zipTree(aarFile)
                into "src/main/jni/composition/lib/litert"
                include "jni/**/*.so"
            }
        }
    }
}

afterEvaluate {
    tasks.findAll { task ->
        !task.name.contains("Clean") &&
            (task.name.contains("externalNative") ||
             task.name.contains("CMake") ||
             task.name.contains("generateJsonModel"))
    }.forEach { task ->
        task.dependsOn(extractLitertHeaders, extractLitertSO)
    }
}
